[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-fraud-detection"
version = "0.1.0"
description = "End-to-end machine learning system for financial fraud detection"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "jupyter",
    "ipykernel",
    "xgboost",
    "shap",
    "fastapi",
    "uvicorn",
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]